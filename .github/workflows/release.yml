name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          # Do NOT add `registry-url:` here. setup-node would then write
          # `_authToken=${NODE_AUTH_TOKEN}` to .npmrc, npm treats that as
          # pre-configured auth and skips OIDC exchange — publish gets E404.

      - name: Upgrade npm to >= 11.5.1 for Trusted Publishing OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # `changesets/action` does one of two things: it opens the version PR when
      # changesets are pending, and publishes when they are not. Gating the step
      # on pending changesets alone therefore made publishing unreachable - the
      # version PR consumes the changesets, so the run that merges it always saw
      # zero and skipped. Gate on both signals instead.
      #
      # The second signal exists because `changeset publish` cannot express
      # "nothing to do": its per-package registry probe false-negatives on this
      # runner and reattempts every package, which npm rejects. Comparing a
      # bellwether package against the registry keeps that case unreachable.
      # All @easy-web/* packages are a `fixed` version group, so any one of them
      # is a faithful proxy for the whole family. README.md is docs, not a
      # changeset.
      - name: Determine release action
        id: release-state
        shell: bash
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d '[:space:]')
          LOCAL=$(node -p "require('./packages/i18n/package.json').version")
          REMOTE=$(npm view @easy-web/i18n version 2>/dev/null || echo "none")

          if [ "$LOCAL" != "$REMOTE" ]; then NEEDS_PUBLISH=true; else NEEDS_PUBLISH=false; fi

          {
            echo "changesets=$COUNT"
            echo "needs_publish=$NEEDS_PUBLISH"
          } >> "$GITHUB_OUTPUT"

          echo "Pending changesets: $COUNT"
          echo "Bellwether @easy-web/i18n - local: $LOCAL, npm: $REMOTE, needs publish: $NEEDS_PUBLISH"

      - name: Create Release Pull Request or Publish
        id: changesets
        if: steps.release-state.outputs.changesets != '0' || steps.release-state.outputs.needs_publish == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          # Publish auth comes from OIDC Trusted Publishing. Do NOT add any npm
          # auth token to this block: changesets/action@v1 prefers a token over
          # OIDC and would silently bypass Trusted Publishing with no error.
          # See AGENTS.md -> Release-workflow configuration invariants, trap (4).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
