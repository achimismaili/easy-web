name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          # Do NOT add `registry-url:` here. setup-node would then write
          # `_authToken=${NODE_AUTH_TOKEN}` to .npmrc, npm treats that as
          # pre-configured auth and skips OIDC exchange — publish gets E404.

      - name: Upgrade npm to >= 11.5.1 for Trusted Publishing OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Guard for the zero-changeset case: `changeset publish` cannot express
      # "nothing to do" — its per-package registry probe false-negatives on this
      # runner and it republishes everything, which npm rejects. Skipping the
      # step makes that case unreachable. README.md is docs, not a changeset.
      - name: Check for pending changesets
        id: changeset-check
        shell: bash
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d '[:space:]')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $COUNT"

      - name: Create Release Pull Request or Publish
        id: changesets
        if: steps.changeset-check.outputs.count != '0'
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          # Publish auth comes from OIDC Trusted Publishing. Do NOT add any npm
          # auth token to this block: changesets/action@v1 prefers a token over
          # OIDC and would silently bypass Trusted Publishing with no error.
          # See AGENTS.md -> Release-workflow configuration invariants, trap (4).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
